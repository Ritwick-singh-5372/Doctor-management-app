services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: careflow
      # Local development only. Use a secret manager for deployed credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - careflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  careflow_postgres:
